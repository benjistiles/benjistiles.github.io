<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#080808">
    <meta name="description" content="Contact and website links for jazz bassist Benji Stiles.">
    <title>Benji Stiles | Jazz Bassist</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&amp;family=Playfair+Display:wght@400;500;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #080808;
            --section-bg: #121212;
            --accent-color: #89bd88;
            --text-primary: #ffffff;
            --text-secondary: #929f93;
            --transition: 180ms ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
            background: var(--bg-color);
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            background:
                radial-gradient(circle at 50% -8%, rgba(137, 189, 136, 0.13), transparent 34rem),
                var(--bg-color);
            color: var(--text-primary);
            font-family: "Inter", sans-serif;
            line-height: 1.5;
            padding:
                max(26px, env(safe-area-inset-top))
                max(20px, env(safe-area-inset-right))
                max(24px, env(safe-area-inset-bottom))
                max(20px, env(safe-area-inset-left));
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page-shell {
            width: min(100%, 520px);
            min-height: calc(100svh - 50px);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .identity {
            text-align: center;
            margin-bottom: 30px;
            animation: fade-in 600ms ease both;
        }

        .logo-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
            min-height: 48px;
            margin-bottom: 17px;
            border-radius: 12px;
        }

        .logo-link:focus-visible,
        .link-button:focus-visible {
            outline: 3px solid rgba(137, 189, 136, 0.55);
            outline-offset: 4px;
        }

        .logo {
            display: block;
            width: auto;
            height: 104px;
            max-width: 72vw;
            object-fit: contain;
        }

        h1 {
            font-family: "Playfair Display", serif;
            font-size: clamp(2.35rem, 10vw, 3.35rem);
            font-weight: 500;
            letter-spacing: 0.02em;
            line-height: 1.05;
            text-wrap: balance;
        }

        .occupation {
            margin-top: 11px;
            color: var(--accent-color);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .links {
            display: grid;
            gap: 13px;
        }

        .link-button {
            min-height: 68px;
            display: grid;
            grid-template-columns: 42px 1fr 20px;
            align-items: center;
            gap: 13px;
            padding: 12px 20px 12px 15px;
            background: rgba(18, 18, 18, 0.93);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.24);
            transition:
                transform var(--transition),
                border-color var(--transition),
                background var(--transition);
            animation: rise-in 520ms ease both;
            -webkit-tap-highlight-color: transparent;
        }

        .link-button:nth-child(2) {
            animation-delay: 70ms;
        }

        .link-button:nth-child(3) {
            animation-delay: 140ms;
        }

        .link-button:hover {
            transform: translateY(-2px);
            background: rgba(137, 189, 136, 0.08);
            border-color: rgba(137, 189, 136, 0.62);
        }

        .link-button:active {
            transform: scale(0.985);
        }

        .primary-link {
            color: var(--bg-color);
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        .primary-link:hover {
            color: var(--bg-color);
            background: #9bc99a;
            border-color: #9bc99a;
        }

        .link-icon {
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(137, 189, 136, 0.10);
            border: 1px solid rgba(137, 189, 136, 0.22);
            border-radius: 50%;
            color: var(--accent-color);
            font-size: 1rem;
        }

        .primary-link .link-icon {
            background: rgba(8, 8, 8, 0.11);
            border-color: rgba(8, 8, 8, 0.16);
            color: var(--bg-color);
        }

        .link-copy {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .link-label {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .link-detail {
            color: var(--text-secondary);
            font-size: 0.76rem;
            font-weight: 400;
        }

        .primary-link .link-detail {
            color: rgba(8, 8, 8, 0.68);
        }

        .link-arrow {
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-align: right;
        }

        .primary-link .link-arrow {
            color: rgba(8, 8, 8, 0.68);
        }

        footer {
            margin-top: 30px;
            color: var(--text-secondary);
            font-size: 0.69rem;
            letter-spacing: 0.13em;
            text-align: center;
            text-transform: uppercase;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes rise-in {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-height: 650px) {
            .page-shell {
                justify-content: flex-start;
            }

            .identity {
                margin-bottom: 22px;
            }

            .logo {
                height: 78px;
            }

            h1 {
                font-size: 2.2rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="page-shell">
        <header class="identity">
            <a class="logo-link" href="https://benjistilesmusic.com/" aria-label="Visit Benji Stiles Music">
                <img class="logo" src="images/logo.png" alt="Benji Stiles Music logo">
            </a>
            <h1>Benji Stiles</h1>
            <p class="occupation">Jazz Bassist</p>
        </header>

        <nav class="links" aria-label="Contact links">
            <a class="link-button primary-link" href="benji-stiles.vcf" type="text/vcard">
                <span class="link-icon" aria-hidden="true"><i class="fa-solid fa-address-card"></i></span>
                <span class="link-copy">
                    <span class="link-label">Save Contact</span>
                    <span class="link-detail">Add Benji to your phone</span>
                </span>
                <span class="link-arrow" aria-hidden="true"><i class="fa-solid fa-plus"></i></span>
            </a>

            <a class="link-button" href="mailto:benjistilesmusic@gmail.com?subject=Hello%20Benji">
                <span class="link-icon" aria-hidden="true"><i class="fa-solid fa-envelope"></i></span>
                <span class="link-copy">
                    <span class="link-label">Email Me</span>
                    <span class="link-detail">benjistilesmusic@gmail.com</span>
                </span>
                <span class="link-arrow" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></span>
            </a>

            <a class="link-button" href="https://benjistilesmusic.com/">
                <span class="link-icon" aria-hidden="true"><i class="fa-solid fa-globe"></i></span>
                <span class="link-copy">
                    <span class="link-label">Visit My Website</span>
                    <span class="link-detail">benjistilesmusic.com</span>
                </span>
                <span class="link-arrow" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></span>
            </a>
        </nav>

        <footer>&copy; 2026 Benji Stiles</footer>
    </main>
</body>
</html>
