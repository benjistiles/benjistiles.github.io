<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#20231f">
    <meta name="description" content="Contact and website links for jazz bassist Benji Stiles.">
    <title>Benji Stiles | Jazz Bassist</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <style>
        :root {
            color-scheme: light;
            --parchment: #f2eee6;
            --ink: #20231f;
            --stone: #ddd5c8;
            --clay: #a86f50;
            --sage: #687260;
            --sage-ink: #5f6858;
            --sage-deep: #545d4f;
            --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --serif: Georgia, "Times New Roman", Times, serif;
            --ease: 180ms ease;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        * {
            margin: 0;
        }

        html {
            min-height: 100%;
            background: var(--ink);
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            padding:
                max(14px, env(safe-area-inset-top))
                max(14px, env(safe-area-inset-right))
                max(14px, env(safe-area-inset-bottom))
                max(14px, env(safe-area-inset-left));
            background:
                radial-gradient(circle at 8% 5%, rgba(168, 111, 80, 0.13), transparent 20rem),
                radial-gradient(circle at 95% 92%, rgba(104, 114, 96, 0.15), transparent 24rem),
                var(--ink);
            color: var(--ink);
            font-family: var(--sans);
            line-height: 1.5;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page-shell {
            width: min(100%, 620px);
            min-height: calc(100svh - 28px);
            margin-inline: auto;
            display: flex;
            align-items: center;
        }

        .contact-card {
            width: 100%;
            min-height: calc(100svh - 28px);
            overflow: hidden;
            background: var(--parchment);
            border: 1px solid var(--stone);
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
            animation: card-in 500ms ease both;
            display: flex;
            flex-direction: column;
        }

        .logo-panel {
            display: flex;
            justify-content: center;
            padding: 28px 24px 24px;
            background: var(--ink);
            border-bottom: 1px solid rgba(242, 238, 230, 0.18);
        }

        .logo {
            width: 72px;
            height: 72px;
            display: block;
            object-fit: cover;
        }

        .links {
            width: 100%;
            display: grid;
            flex: 1;
            align-content: center;
            padding: 24px;
        }

        .link-button {
            min-height: 70px;
            display: flex;
            align-items: center;
            gap: 20px;
            justify-content: center;
            padding: 12px 16px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            border: 1px solid var(--stone);
            border-radius: 10px;
            transition: background-color var(--ease), color var(--ease), border-color var(--ease);
            -webkit-tap-highlight-color: transparent;
        }

        .link-button:hover,
        .link-button:active {
            background: var(--stone);
        }

        .link-button:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 3px;
        }

        .link-copy {
            min-width: 0;
            display: grid;
            gap: 2px;
            text-align: center;
        }

        .link-label {
            font-family: var(--serif);
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.015em;
        }

        .link-detail {
            overflow-wrap: anywhere;
            color: #51564d;
            font-size: 0.76rem;
        }

        .link-symbol {
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            justify-self: end;
            border: 1px solid currentColor;
            border-radius: 50%;
            font-family: var(--sans);
            font-size: 1rem;
            line-height: 1;
            padding: 0;
            text-align: center;
        }

        .link-symbol svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
        }

        footer {
            display: flex;
            justify-content: center;
            padding: 14px 24px;
            border-radius: 0 0 16px 16px;
            background: var(--stone);
            color: #4a4f47;
            font-family: var(--sans);
            font-size: 0.7rem;
            letter-spacing: 0.08em;
        }

        @media (min-width: 600px) {
            body {
                padding:
                    max(28px, env(safe-area-inset-top))
                    max(28px, env(safe-area-inset-right))
                    max(28px, env(safe-area-inset-bottom))
                    max(28px, env(safe-area-inset-left));
            }

            .page-shell {
                min-height: calc(100svh - 56px);
            }

            .contact-card {
                min-height: calc(100svh - 56px);
                box-shadow: 0 22px 55px rgba(0, 0, 0, 0.2);
            }

            .links {
                padding: 32px 30px;
            }
        }

        @media (max-height: 700px) {
            .page-shell {
                align-items: flex-start;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @keyframes card-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <main class="page-shell">
        <article class="contact-card">
            <div class="logo-panel">
                <img class="logo" src="images/logo.png" alt="Benji Stiles">
            </div>

            <nav class="links" aria-label="Benji Stiles links">
                <a class="link-button" href="benji-stiles.vcf" type="text/vcard">
                    <span class="link-copy">
                        <span class="link-label">Save contact</span>
                        <span class="link-detail">Add Benji to your phone</span>
                    </span>
                    <span class="link-symbol" aria-hidden="true">+</span>
                </a>
                <a class="link-button" href="mailto:benjistilesmusic@gmail.com?subject=Hello%20Benji">
                    <span class="link-copy">
                        <span class="link-label">Send an email</span>
                        <span class="link-detail">benjistilesmusic@gmail.com</span>
                    </span>
                    <span class="link-symbol" aria-hidden="true">@</span>
                </a>
                <a class="link-button" href="https://benjistilesmusic.com/">
                    <span class="link-copy">
                        <span class="link-label">Visit the website</span>
                        <span class="link-detail">benjistilesmusic.com</span>
                    </span>
                    <span class="link-symbol" aria-hidden="true">↗</span>
                </a>

                <a class="link-button" href="https://www.instagram.com/benjistilesmusic/" target="_blank" rel="noreferrer">
                    <span class="link-copy">
                        <span class="link-label">Follow on Instagram</span>
                        <span class="link-detail">@benjistilesmusic</span>
                    </span>
                    <span class="link-symbol" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false">
                            <path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9Zm9.75 1.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/>
                        </svg>
                    </span>
                </a>
            </nav>

            <footer>
                <span>&copy; 2026 Benji Stiles</span>
            </footer>
        </article>
    </main>
</body>
</html>
